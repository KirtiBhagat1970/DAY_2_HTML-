<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Basics</title>
    <style>
        .web_btn{
            background-color: rgb(10,102,194);
            color: white;
            font-weight: bold;
            border-radius: 30px;
            height:40px;
            width:220px;
            border:none;
            margin-right: 10px;
            cursor:pointer;
        }
        .save_btn{
            background-color: white;
            color: rgb(10,102,194);
            border-color: rgb(10,102,194);
            border-radius: 20px;
            height: 40px;
            width:100px;
            border-style: solid;
            font-weight: bold;
            cursor:pointer;
            
        }
    </style>
</head>
<body>
    <button class="web_btn">
        Apply on company website
    </button>
    <button class="save_btn">
        Save
    </button>
</body>
</html>
