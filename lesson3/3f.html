<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <style>
        a{
            color: rgb(0,113,133);
            font-size: 20px;
        }
        #first{
            font-size:4ch;
            font-weight: bold;
        }
        #second{
            font-weight: bold;
            color: rgb(0,118,0);
            font-size: 20px;
        }
        .add_btn{
            background-color: rgb(255,216,20);
            color:black;
            border:none;
            height:30px;
            width:100px;
            border-radius: 15px;
            margin-right: 15px;
            
        }
        .buy_btn{
            background-color: rgb(255,164,28);
            color:black;
            border:none;
            height:30px;
            width:120px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
     <a href="https://amazon.com/"  >Back to Amazon</a>
    <p id="first">Nike Black Running Shoes</p>
    <p id="second">$39 - in stock.</p>
    <p style="font-size: 20px;" >Free delivery tomorrow. </p>
    <button class="add_btn">
        Add to card
    </button>
    <button class="buy_btn">
        Buy now
    </button>
 
</body>
</html>
